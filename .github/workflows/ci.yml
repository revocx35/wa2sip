name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest -q

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test

  e2e:
    # the real image against a real Asterisk, with simulated WhatsApp accounts,
    # plus the Chromium <-> PulseAudio audio path with Chromium's sandbox on
    runs-on: ubuntu-latest
    needs: [python, agent]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wa2sip:ci .
      - run: docker build -t wa2sip-test-pbx tools/test-pbx
      - name: Audio path (Chromium + PulseAudio, sandboxed)
        run: |
          docker run --rm --security-opt seccomp=$PWD/seccomp-chromium.json --cap-drop ALL \
            --security-opt no-new-privileges:true wa2sip:ci python tools/audio_loopback.py
      - name: Start PBX and wa2sip (simulated WhatsApp)
        run: |
          docker run -d --name pbx --network host wa2sip-test-pbx
          docker run -d --name wa2sip --network host -e WA2SIP_WA_DRIVER=fake \
            -e WA2SIP_ADMIN_PASSWORD=e2e-password-1 wa2sip:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8092/api/health && break; sleep 1; done
          sleep 3
      - name: End-to-end calls through Asterisk
        run: docker run --rm --network host -v $PWD:/src -w /src wa2sip:ci python tools/e2e_fake.py
      - if: failure()
        run: |
          docker logs wa2sip | tail -100
          docker logs pbx | tail -60
