; wa2sip test PBX: UDP 5160 (runs next to wa2sip on 5064 with host networking)
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5160

[endpoint-tpl](!)
type = endpoint
context = default
disallow = all
allow = alaw,ulaw
dtmf_mode = rfc4733
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[aor-tpl](!)
type = aor
max_contacts = 1
remove_existing = yes

[auth-tpl](!)
type = auth
auth_type = userpass

; extensions wa2sip registers (password Test-<ext>-pw)
[1009](endpoint-tpl)
trust_id_inbound = yes      ; show the WhatsApp caller (P-Asserted-Identity) instead of "WhatsApp"
auth = 1009
aors = 1009
callerid = "WhatsApp" <1009>
[1009](aor-tpl)
[1009](auth-tpl)
username = 1009
password = Test-1009-pw

[1010](endpoint-tpl)
trust_id_inbound = yes
auth = 1010
aors = 1010
callerid = "WhatsApp 2" <1010>
[1010](aor-tpl)
[1010](auth-tpl)
username = 1010
password = Test-1010-pw

; test phones
[2001](endpoint-tpl)
auth = 2001
aors = 2001
callerid = "Alice Desk" <2001>
[2001](aor-tpl)
[2001](auth-tpl)
username = 2001
password = Test-2001-pw

[2002](endpoint-tpl)
auth = 2002
aors = 2002
dtmf_mode = inband
allow = !all,ulaw
callerid = "Bob Desk" <2002>
[2002](aor-tpl)
[2002](auth-tpl)
username = 2002
password = Test-2002-pw
